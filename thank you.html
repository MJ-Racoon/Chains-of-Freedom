<style>
 body {
  display: flex;
  justify-content: center;
  flex-direction: column;
  align-items: center;

  min-height: 100vh;
  margin: 0;

  background-color: #383B28;
  background-image: url("./Img/Chains.webp"), url("./Img/Wallpaper.webp");
  background-repeat: repeat-y, repeat;
  background-size: 100%, 500px 500px;
  font-family: "Noto Serif", serif;
}

html, body {
  height: 100%;
  margin: 0;
}

* {
    color: rgb(0, 0, 0);
    margin: 0px;
    padding:0px;
}

html {
  scroll-behavior: smooth;
}



/* Corner decoration */

.corner-top {
    display: flex;
    justify-content: center;
}

.corner-bottom {
    display: flex;
    justify-content: center;
}

#top-left { 
    top: 0; left: 0; position: absolute;}

#top-right { top: 0; right: 0; position: absolute; }

#bottom-left { bottom: 0; left: 0; position: absolute;}

#bottom-right { bottom: 0; right: 0; position: absolute;}



/* Content */

.home-button {
  display: flex;
  justify-content: center; 

 
  padding-bottom: 50px;
  
  
  width: 100%;
  max-width: 800px;
}

.home-button a {
  color:#E9D899;
  padding: 2px 8px;
  font-weight: bold;
  font-size: 1.5rem;
  text-decoration: none;
  transition: all 0.3s ease-in-out;
}

.home-button a:hover {
  color: rgb(230, 228, 208);                /* Hover-Farbe für Text + Pfeil */
  background: linear-gradient(90deg, rgba(233,216,153,0.2), rgba(232,8,202,0.2));
  padding: 2px 8px;
  cursor: pointer;
  text-decoration: none;
  text-shadow: 0 0 3px rgb(230, 228, 208);
}

.center-wrapper {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction:column;
}

.body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  position: relative;
  box-sizing: border-box;

  width: 100%;           /* Container will so breit wie möglich sein */
  max-width: 1500px;     /* aber nicht breiter als 1000px */
  min-width: 300px;      /* optional für sehr kleine Bildschirme */
  
  margin: 0 10px;        /* horizontalen Abstand von 10px auf kleinen Bildschirmen */
  height: 250px;

  background-color: #968170;
  border: 3px solid #1d1815;  
  margin: 20px;      
 
}



.Confirmed {
  display: flex;
  flex-direction: column;
  text-align: center;
  padding: 50px 5px;
}

.Confirmed p {
   color: #1d1815;
   font-size: 1.5em;
   font-weight: bold;
}

.Confirmed h3 {
  padding-top: 20px;
   color:#1d1815;
   font-size: 1em;
}


.footer {
    padding: 20px 20px;
    margin-top: auto;   
    background-color: #968170;
    width: 100%;          
    box-sizing: border-box;
}

#copyright {
  font-size: 0.7em;
  text-align: center;
}

</style>

<!-- Content -->

<main class="center-wrapper">
<div class="body">

    <img id="top-right" src="Img/corner top right.webp" width="60px" height="60px" alt=""/>
  </div>


  <div class="Confirmed">

</div>
 <div class="home-button">
